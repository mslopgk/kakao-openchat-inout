<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>들낙 감지기</title>
<style>
/* 레이아웃: 상단 바 + 힌트 배너 + (현황 타일 / 감시 방 / 블랙리스트 / 이벤트 로그) 세로 스택.
   팔레트: 중립 슬레이트 바탕에 파랑 액센트 1개, 의미색(ok/경고/위험)만 제한적으로. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#f0f2f5; --elev:#ffffff;
  --border:#e4e7ec; --border2:#d4d9e0;
  --fg:#171a1f; --muted:#5a6473; --faint:#8a93a2;
  --accent:#2f6bff; --accent-soft:#e8efff;
  --ok:#17946b; --ok-soft:#e3f5ee;
  --warn:#9a6a12; --warn-soft:#fbf0d8;
  --crit:#d4453e; --crit-soft:#fce7e6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 8px 24px -12px rgba(16,24,40,.28);
  --mono:ui-monospace,"Cascadia Code","Cascadia Mono",Consolas,"SFMono-Regular",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  --r:12px; --r-sm:8px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#16191e; --surface2:#1b1f26; --elev:#1b1f26;
  --border:#262b33; --border2:#333a44;
  --fg:#e7eaef; --muted:#9aa3b1; --faint:#6b7483;
  --accent:#6d9bff; --accent-soft:#1b2540;
  --ok:#3bca8f; --ok-soft:#10271f;
  --warn:#e4ad53; --warn-soft:#2a2111;
  --crit:#f0726b; --crit-soft:#2c1514;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 16px 40px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --surface:#16191e; --surface2:#1b1f26; --elev:#1b1f26;
    --border:#262b33; --border2:#333a44;
    --fg:#e7eaef; --muted:#9aa3b1; --faint:#6b7483;
    --accent:#6d9bff; --accent-soft:#1b2540;
    --ok:#3bca8f; --ok-soft:#10271f;
    --warn:#e4ad53; --warn-soft:#2a2111;
    --crit:#f0726b; --crit-soft:#2c1514;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 16px 40px -24px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2{margin:0;font-weight:600}
button{font-family:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 상단 바 ── */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  max-width:1200px;margin:0 auto;padding:12px 20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--accent);color:#fff;font-weight:700;font-size:14px}
.brand h1{font-size:15px;letter-spacing:-.1px}
.brand .sub{color:var(--faint);font-size:12px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--border2);background:var(--surface);color:var(--muted);
  font-size:12px;font-weight:500;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.dot.off{background:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.ctl{display:flex;align-items:center;gap:8px}
.field{display:flex;align-items:center;gap:7px;color:var(--faint);font-size:11px;
  font-weight:600;letter-spacing:.4px;text-transform:uppercase}
select,.btn{appearance:none;background:var(--surface);color:var(--fg);border:1px solid var(--border2);
  border-radius:var(--r-sm);padding:7px 11px;font-size:13px;transition:border-color .15s,background .15s}
select:hover,.btn:hover{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.btn.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.icon-btn{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:15px;
  background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--muted)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── 힌트 배너 ── */
.hint{max-width:1200px;margin:14px auto 0;padding:11px 16px;border-radius:var(--r);
  display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;
  border:1px solid var(--border)}
.hint.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
.hint.err{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 30%,transparent);color:var(--crit)}

/* ── 본문 ── */
.wrap{max-width:1200px;margin:0 auto;padding:18px 20px 40px;display:grid;gap:16px}

/* 현황 타일 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--shadow);position:relative}
.tile .lbl{color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.tile .num{margin-top:6px;font-family:var(--mono);font-weight:650;font-size:30px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-1px}
.tile.alert .num{color:var(--crit)}
.tile.good .num{color:var(--ok)}

/* 카드 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.card>h2{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);
  font-size:13px;font-weight:600}
.card>h2 .note{margin-left:auto;color:var(--faint);font-size:12px;font-weight:400}
.card>h2 .note label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}

/* 감시 방 칩 */
.watch{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border2);background:var(--surface);color:var(--muted);font-size:13px;
  user-select:none;transition:border-color .12s,background .12s,color .12s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent)}
.chip .cb{font-size:13px}
.watch .allbtn{margin-left:auto}
.empty{padding:26px 18px;text-align:center;color:var(--faint);font-size:13px}

/* 테이블 */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;color:var(--faint);font-weight:600;font-size:11px;
  letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface2)}
td.nicks{white-space:normal;max-width:340px}
.uid{font-family:var(--mono);font-size:12px;color:var(--muted)}
.time{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cnum{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:center;font-weight:600}
.cnum.z{color:var(--faint);font-weight:400}

tr.dl td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
tr.dl{background:color-mix(in srgb,var(--crit-soft) 60%,transparent)}
tr.dl:hover{background:var(--crit-soft)}
tr.wl{opacity:.5}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:600;font-family:var(--mono)}
.tag.join{background:var(--ok-soft);color:var(--ok)}
.tag.leave{background:var(--warn-soft);color:var(--warn)}
.tag.kick{background:var(--crit-soft);color:var(--crit)}
.tag.dl{background:var(--crit);color:#fff}
.chipn{display:inline-block;margin:2px 4px 2px 0;padding:2px 9px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--border);font-size:12px}
.reason{color:var(--crit);font-size:12.5px}
.dash{color:var(--faint)}
.tgl{padding:5px 10px;font-size:12px;border-radius:var(--r-sm);border:1px solid var(--border2);
  background:var(--surface);color:var(--muted)}
.tgl:hover{border-color:var(--accent);color:var(--accent)}
.tgl.is-wl{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.foot{text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);padding:4px 0}

@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .brand .sub{display:none}
  .bar{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header>
  <div class="bar">
    <div class="brand">
      <span class="logo">들</span>
      <div>
        <h1>들낙 감지기</h1>
        <div class="sub">오픈채팅 입·퇴장 모니터</div>
      </div>
    </div>
    <span class="spacer"></span>
    <span id="live" class="pill"><span class="dot"></span>연결 확인중</span>
    <div class="ctl">
      <label class="field">방
        <select id="room"><option value="">전체</option></select>
      </label>
      <button id="auto" class="btn active">자동 새로고침</button>
      <button id="theme" class="icon-btn" title="테마 전환">◐</button>
    </div>
  </div>
</header>

<div id="hint" class="hint" hidden></div>

<div class="wrap">
  <div class="stats" id="stat"></div>

  <section class="card">
    <h2>감시 방 설정 <span class="note" id="watchsum"></span></h2>
    <div class="watch" id="watchlist"></div>
  </section>

  <section class="card">
    <h2>들낙 블랙리스트 <span class="note">userId 기준 · 프로필 바꿔도 묶임</span></h2>
    <div class="tbl"><table>
      <thead><tr><th>들낙</th><th>방</th><th>사용 닉네임</th><th>입장</th><th>퇴장</th>
        <th>강퇴</th><th>최근 활동</th><th>userId</th><th>관리</th></tr></thead>
      <tbody id="bl"></tbody>
    </table></div>
  </section>

  <section class="card">
    <h2>실시간 이벤트 로그
      <span class="note"><label><input type="checkbox" id="onlydl"> 들낙만 보기</label></span></h2>
    <div class="tbl"><table>
      <thead><tr><th>시각</th><th>방</th><th>동작</th><th>닉네임</th><th>userId</th><th>들낙 사유</th></tr></thead>
      <tbody id="log"></tbody>
    </table></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script>
let auto=true, rooms={};
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tagCls=a=>({'입장':'join','퇴장':'leave','강퇴':'kick'}[a]||'');
async function j(u,o){const r=await fetch(u,o);return r.json();}

/* 테마: 저장된 선택 > 시스템 */
(function(){
  let t=null; try{t=localStorage.getItem('deullak-theme');}catch(e){}
  if(t)document.documentElement.setAttribute('data-theme',t);
  $('#theme').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    const next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('deullak-theme',next);}catch(e){}
  };
})();

async function tickStatus(){
  const s=await j('/api/status');
  const ok=s.age_sec!=null && s.age_sec<15 && !s.error;
  $('#live').innerHTML=`<span class="dot ${ok?'on':'off'}"></span>`+
    (ok?`감지 중 · ${s.age_sec}s 전`:(s.error?'오류 · '+esc(String(s.error).slice(0,40)):'대기 중'));
  $('#live').title=s.serial?`${s.serial} · ${s.read_mode}`:'';

  const sel=$('#room'), cur=sel.value;
  rooms=s.rooms||{};
  if(sel.dataset.n!=Object.keys(rooms).length){
    sel.innerHTML=['<option value="">전체 방</option>',
      ...Object.entries(rooms).map(([id,n])=>`<option value="${esc(id)}">${esc(n)}</option>`)].join('');
    sel.value=cur; sel.dataset.n=Object.keys(rooms).length;
  }
  $('#foot').textContent=`${s.serial||'-'}  ·  ${s.read_mode}  ·  폴링 ${s.age_sec!=null?s.age_sec+'s':'-'}  ·  ${new Date().toLocaleTimeString('ko-KR')}`;

  const hb=$('#hint');
  if(s.hint){const login=/로그인|실행|켜/.test(s.hint);
    hb.className='hint '+(login?'err':'warn');
    hb.textContent=(login?'⚠ ':'ℹ ')+s.hint; hb.hidden=false;
  }else hb.hidden=true;
  buildWatch(rooms, s.watch||[]);
}

let _watchSig='';
function buildWatch(rooms, watch){
  const ids=Object.keys(rooms);
  const sig=ids.join(',')+'|'+watch.join(',');
  if(sig===_watchSig) return; _watchSig=sig;
  const all=watch.length===0;
  $('#watchsum').textContent = ids.length
    ? (all?`전체 ${ids.length}개 방 감시 중`:`${watch.length} / ${ids.length}개 방 감시`) : '';
  const wl=$('#watchlist'); wl.innerHTML='';
  if(!ids.length){wl.innerHTML='<div class="empty">표시할 오픈채팅 방이 없습니다. 카톡에서 감시할 방을 한 번 열어주세요.</div>';return;}
  for(const id of ids){
    const on = all || watch.includes(id);
    const c=document.createElement('div');
    c.className='chip'+(on?' on':'');
    c.innerHTML=`<span class="cb">${on?'☑':'☐'}</span>${esc(rooms[id])}`;
    c.onclick=async()=>{
      let s = watch.length? new Set(watch) : new Set(ids);
      if(s.has(id)) s.delete(id); else s.add(id);
      let next = (s.size===ids.length)? [] : [...s];
      await post('/api/watch',{watch:next});
      _watchSig=''; loop();
    };
    wl.appendChild(c);
  }
  const b=document.createElement('button');
  b.className='btn allbtn'; b.textContent='전체 감시';
  b.onclick=async()=>{ await post('/api/watch',{watch:[]}); _watchSig=''; loop(); };
  wl.appendChild(b);
}

function post(u,body){
  return j(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
}

async function tickData(){
  const room=$('#room').value, qs=room?`?room=${encodeURIComponent(room)}`:'';
  const [sum,log]=await Promise.all([
    j('/api/summary'+qs),
    j('/api/events'+(room?`?room=${encodeURIComponent(room)}`:'?')+($('#onlydl').checked?'&deullak=1':'')),
  ]);
  const totDL=sum.reduce((a,r)=>a+((r.deullak>0&&!r.whitelisted)?1:0),0);
  const totJ=sum.reduce((a,r)=>a+r.join,0), totL=sum.reduce((a,r)=>a+r.leave,0);
  const tile=(cls,n,l)=>`<div class="tile ${cls}"><div class="lbl">${l}</div><div class="num">${n}</div></div>`;
  $('#stat').innerHTML=
    tile(totDL>0?'alert':'',totDL,'들낙 유저')+
    tile('',sum.length,'관측 유저')+
    tile('good',totJ,'총 입장')+
    tile('',totL,'총 퇴장');

  const bl=$('#bl');
  if(!sum.length){bl.innerHTML='<tr><td colspan="9" class="empty">관측된 유저가 없습니다.</td></tr>';}
  else bl.innerHTML=sum.map(r=>{
    const cls=(r.deullak>0&&!r.whitelisted)?'dl':(r.whitelisted?'wl':'');
    const nicks=r.nicks.map(n=>`<span class="chipn">${esc(n)}</span>`).join('')||'<span class="dash">—</span>';
    const dl=r.deullak>0?`<span class="tag dl">⚠ ${r.deullak}</span>`:'<span class="dash">·</span>';
    return `<tr class="${cls}"><td>${dl}</td><td>${esc(r.room)}</td><td class="nicks">${nicks}</td>`+
      `<td class="cnum" style="color:var(--ok)">${r.join}</td>`+
      `<td class="cnum" style="color:var(--warn)">${r.leave}</td>`+
      `<td class="cnum ${r.kick?'':'z'}">${r.kick||'·'}</td>`+
      `<td class="time">${esc(r.last)}</td><td class="uid">${esc(r.userId)}</td>`+
      `<td><button class="tgl ${r.whitelisted?'is-wl':''}" data-uid="${esc(r.userId)}" data-wl="${r.whitelisted?1:0}">`+
      `${r.whitelisted?'WL 해제':'화이트리스트'}</button></td></tr>`;
  }).join('');
  bl.querySelectorAll('button[data-uid]').forEach(b=>b.onclick=async()=>{
    await post('/api/note',{userId:b.dataset.uid, whitelist:b.dataset.wl!='1'});
    tickData();
  });

  const tb=$('#log');
  if(!log.length){tb.innerHTML='<tr><td colspan="6" class="empty">이벤트가 없습니다.</td></tr>';}
  else tb.innerHTML=log.map(e=>
    `<tr class="${e.deullak?'dl':''}"><td class="time">${esc(e.time)}</td><td>${esc(e.room)}</td>`+
    `<td><span class="tag ${tagCls(e.action)}">${esc(e.action)}</span></td>`+
    `<td>${esc(e.nick)||'<span class="dash">—</span>'}</td><td class="uid">${esc(e.userId)}</td>`+
    `<td class="reason">${e.reason?'⚠ '+esc(e.reason):'<span class="dash">—</span>'}</td></tr>`
  ).join('');
}

async function loop(){try{await tickStatus();await tickData();}catch(e){}}
$('#auto').onclick=()=>{auto=!auto;
  $('#auto').classList.toggle('active',auto);
  $('#auto').textContent=auto?'자동 새로고침':'새로고침 멈춤';};
$('#room').onchange=tickData;$('#onlydl').onchange=tickData;
loop();setInterval(()=>{if(auto)loop();},4000);
</script></body></html>
